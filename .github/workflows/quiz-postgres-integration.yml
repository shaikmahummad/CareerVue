name: Quiz PostgreSQL integration

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/quiz-postgres-integration.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/quiz-postgres-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiz-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careervue_quiz_test
          POSTGRES_USER: careervue_test
          POSTGRES_PASSWORD: careervue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careervue_test -d careervue_quiz_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://careervue_test:careervue_test@localhost:5432/careervue_app_unused
      QUIZ_TEST_DATABASE_URL: postgresql+asyncpg://careervue_test:careervue_test@localhost:5432/careervue_quiz_test
      CAREERVUE_ALLOW_TEST_DB_RESET: "1"
      SUPABASE_URL: https://example.test
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
      JWT_SECRET: test-only-jwt-secret
      JWT_ALGORITHM: HS256
      RAZORPAY_KEY_ID: test-key
      RAZORPAY_KEY_SECRET: test-secret
      APP_CORS_ORIGINS: '["http://localhost:3000"]'
      QUIZ_CLEANUP_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Alembic revision chain
        run: python -m alembic heads

      - name: Run backend and real PostgreSQL integration tests
        run: python -m unittest discover -s tests -v

