name: Reusable quality and builds

on:
  workflow_call:
    inputs:
      run_backend:
        type: boolean
        default: false
      run_web:
        type: boolean
        default: true
      run_mobile:
        type: boolean
        default: true
      require_mobile_staging_config:
        type: boolean
        default: false
      mobile_api_url:
        type: string
        default: ""
      mobile_supabase_url:
        type: string
        default: ""
      mobile_supabase_anon_key:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  backend-quality:
    if: inputs.run_backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: careervue_quiz_test
          POSTGRES_USER: careervue_test
          POSTGRES_PASSWORD: careervue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careervue_test -d careervue_quiz_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://careervue_test:careervue_test@localhost:5432/careervue_quiz_test
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://careervue_test:careervue_test@localhost:5432/careervue_quiz_test
      QUIZ_TEST_DATABASE_URL: postgresql+asyncpg://careervue_test:careervue_test@localhost:5432/careervue_quiz_test
      CAREERVUE_ALLOW_TEST_DB_RESET: "1"
      CAREERVUE_REQUIRE_POSTGRES_TESTS: "1"
      SUPABASE_URL: https://example.test
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InRlc3QifQ.dGVzdC1zaWduYXR1cmU
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoidGVzdCJ9.dGVzdC1zaWduYXR1cmU
      JWT_SECRET: test-only-jwt-secret
      JWT_ALGORITHM: HS256
      APP_CORS_ORIGINS: '["http://localhost:3000"]'
      QUIZ_CLEANUP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate migrations and run backend regression suite
        working-directory: backend
        run: |
          python -m alembic heads
          python -m alembic upgrade head
          python -m unittest discover -s tests -v
          python -m pip check
          python -m compileall -q app
      - name: Write backend quality status
        if: always()
        run: python scripts/ci/write_status.py backend-quality "${{ job.status }}" --details "Alembic validation and backend regression" --output artifacts/backend-quality/status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-quality-reports
          path: artifacts/backend-quality
          if-no-files-found: error
          retention-days: 14

  web-build:
    if: inputs.run_web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and type-check web and shared client
        run: |
          npm run lint --workspace=@careervue/web
          npm run lint --workspace=@careervue/api-client
      - name: Build Next.js production application
        run: npm run build --workspace=@careervue/web
      - name: Verify build output
        run: test -f apps/web/.next/BUILD_ID
      - name: Write web build status
        if: always()
        run: python scripts/ci/write_status.py web-build "${{ job.status }}" --details "Next.js production build" --output artifacts/build/web-build-status.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: web-build-output
          path: |
            apps/web/.next
            !apps/web/.next/cache
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-build-reports
          path: artifacts/build/web-build-status.json
          if-no-files-found: error
          retention-days: 14

  mobile-build:
    if: inputs.run_mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.mobile_api_url || 'https://example.test' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ inputs.mobile_supabase_url || 'https://example.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ inputs.mobile_supabase_anon_key || 'test-anon-key' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require real staging configuration for the Appium APK
        if: inputs.require_mobile_staging_config
        shell: bash
        run: |
          test -n "$EXPO_PUBLIC_API_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          test "$EXPO_PUBLIC_API_URL" != "https://example.test"
          test "$EXPO_PUBLIC_SUPABASE_URL" != "https://example.supabase.co"
          test "$EXPO_PUBLIC_SUPABASE_ANON_KEY" != "test-anon-key"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Report disk usage before npm install
        run: |
          df -h /
          du -sh "$ANDROID_HOME" 2>/dev/null || true
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Type-check mobile and shared client
        run: |
          npm run lint --workspace=@careervue/mobile
          npm run lint --workspace=@careervue/api-client
      - name: Validate Expo configuration
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Ensure Gradle wrapper exists
        run: |
          test -f apps/mobile/android/gradlew
          chmod +x apps/mobile/android/gradlew
      - name: Configure Gradle dependency and build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Report disk usage before Gradle build
        run: df -h /
      - name: Build emulator APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 -Dorg.gradle.parallel=false -PreactNativeArchitectures=x86_64
      - name: Report disk usage after Gradle build
        if: always()
        run: df -h /
      - name: Verify APK
        run: test -f apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Write mobile build status
        if: always()
        run: python scripts/ci/write_status.py mobile-build "${{ job.status }}" --details "Expo Android debug APK for Appium" --output artifacts/build/mobile-build-status.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mobile-build-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-build-reports
          path: artifacts/build/mobile-build-status.json
          if-no-files-found: error
          retention-days: 14
