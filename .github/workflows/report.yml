name: Reusable consolidated reports

on:
  workflow_call:
    inputs:
      source_run_id:
        description: Existing workflow run containing the test-report artifacts
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing workflow run ID to reuse; no tests will be executed
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-reports.txt
      - name: Install report-generation dependencies
        run: python -m pip install -r scripts/ci/requirements-reports.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-reports"
          path: downloaded-reports
          run-id: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate consolidated HTML, JSON, Excel, and ZIP
        run: python scripts/ci/bundle_reports.py --input downloaded-reports --output ci-reports --archive ci-reports
      - name: Publish workflow summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("ci-reports/summary/pipeline-summary.json").read_text())
          print("# CareerVue CI/CD summary\n")
          print("| Stage | Result | Details |\n|---|---|---|")
          for name, stage in data["stages"].items():
              print(f"| {name} | {stage['result']} | {stage.get('details', '')} |")
          if data.get("performance"):
              p = data["performance"]
              print(f"\nPerformance: P95 `{p.get('response_time_ms', {}).get('p95')}` ms; failed rate `{p.get('failed_request_rate')}`.")
          if data.get("security"):
              print(f"\nSecurity findings: `{data['security'].get('counts')}`.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: consolidated-ci-reports
          path: |
            ci-reports
            ci-reports.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: final-test-summary
          path: ci-reports/excel/FINAL_TEST_SUMMARY.xlsx
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: api-testing-report
          path: ci-reports/excel/API_Testing_Report.xlsx
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: selenium-testing-report
          path: ci-reports/excel/Selenium_Testing_Report.xlsx
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: appium-testing-report
          path: ci-reports/excel/Appium_Testing_Report.xlsx
          if-no-files-found: error
          retention-days: 30

