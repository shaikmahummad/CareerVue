services:
  postgres-quiz-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careervue_quiz_test
      POSTGRES_USER: careervue_test
      POSTGRES_PASSWORD: careervue_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careervue_test -d careervue_quiz_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
